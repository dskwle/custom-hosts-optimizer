name = "custom-hosts-optimizer"
main = "src/index.ts"
compatibility_date = "2024-10-28"
compatibility_flags = ["nodejs_compat"]
# 静态资源：Cloudflare 自动托管 public/ 下的文件；
# binding = "ASSETS" 让 Worker 也能主动读取（暴露为 Fetcher，只能 fetch，没有 get）
assets = { directory = "public", binding = "ASSETS" }

# KV 绑定（binding 名 custom_hosts 对应代码中的 env.custom_hosts）
#
# id 必须是真实存在的 32 位命名空间 ID。wrangler 不会解析环境变量、也不会自动替换占位符，
# 填入非真实 ID 会导致部署失败：
#   KV namespace 'xxx' is not valid. [code: 10042]
#
# 更换命名空间时，把下面 id / preview_id 同时改为新的 ID（两处必须一致）。
# 若希望 ID 不落进仓库，可改回占位符 YOUR_KV_NAMESPACE_ID，
# 由 scripts/inject-kv.mjs 在构建时从 KV_NAMESPACE_ID 环境变量注入。
#
# 获取 ID：npx wrangler kv namespace list
# 或 Dashboard -> Workers & Pages -> KV -> 选中命名空间 -> 右侧 Namespace ID
[[kv_namespaces]]
binding = "custom_hosts"
id = "d6916108024f4976adcaa61966e14f6e"
preview_id = "d6916108024f4976adcaa61966e14f6e"

# 定时任务配置 - 每小时更新一次 hosts
[triggers]
crons = ["0 */1 * * *"]

[vars]
# cron 分片刷新时回调自身的地址（必须与线上域名一致）
WORKER_URL = "https://host.drun.kdns.fr"
# 内部分片刷新的调用凭据。该端点只能触发数据刷新，不返回业务数据。
# 如需更严格的控制，改用 `wrangler secret put INTERNAL_TOKEN` 覆盖此值。
INTERNAL_TOKEN = "df189c2eef791050a44e561e115a8f8f"

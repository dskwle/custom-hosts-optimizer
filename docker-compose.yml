name: custom-hosts

services:
  app:
    build:
      context: .
      args:
        # 国内网络可改用 https://registry.npmmirror.com 加速 npm 安装
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: custom-hosts-optimizer:1.3.0
    container_name: custom-hosts
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    # 用 host 网络是为了拿到宿主机的 IPv6 出口：
    # bridge 网络默认没有 IPv6 路由，ULA + NAT66 又得手工维护 ip6tables，重启即失效。
    # 代价是不再做端口映射，服务直接监听宿主机端口（下面的 PORT）。
    network_mode: host
    environment:
      # 只绑 IPv4。宿主机有公网 IPv6 地址，绑到 :: 会把无鉴权控制台暴露到公网；
      # 出站 IPv6 探测不受监听地址影响，0.0.0.0 一样能连 IPv6 目标。
      HOST: 0.0.0.0
      PORT: "${APP_PORT:-8788}"
      # 探测 IPv6 候选（DoH 返回的 AAAA），优选结果里会同时输出 v4/v6 地址
      ENABLE_IPV6: "true"
      # 国际 DoH 在国内不可达，保持关闭
      ENABLE_INTL_DOH: "false"
      # 管理界面密码：控制台、/local/*、/api/* 需要 Basic Auth（用户名随意）；
      # /host、/host_fast、/host_block 不鉴权，方便直接订阅
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-123456}"
      # 设为 off 可整体关闭鉴权（不建议，控制台能直接改 hosts 配置）
      ADMIN_AUTH: "${ADMIN_AUTH:-on}"
      TZ: Asia/Shanghai
    volumes:
      # KV 快照、IP 缓存、阻断清单都在这里，容器重建不丢
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 每 2 小时触发一次全量刷新（与 IP 缓存 TTL 对齐）
  refresher:
    image: curlimages/curl:8.11.1
    container_name: custom-hosts-refresher
    restart: unless-stopped
    # 与 app 同网络命名空间，直接用 127.0.0.1 访问
    network_mode: host
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT:-8788}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-7200}
      TZ: Asia/Shanghai
      # 刷新接口现在需要认证，这里跟着主服务的密码走
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-123456}"
      ADMIN_AUTH: "${ADMIN_AUTH:-on}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[refresher] 已启动，间隔 $${REFRESH_INTERVAL}s"
        if [ "$${ADMIN_AUTH}" = "off" ]; then
          AUTH=""
        else
          AUTH="-u admin:$${ADMIN_PASSWORD}"
        fi
        while true; do
          if curl -fsS -m 600 $$AUTH -X POST "http://127.0.0.1:$${APP_PORT}/local/refresh?wait=true" -o /tmp/result.json; then
            echo "[refresher] $(date '+%F %T') 刷新成功 $(head -c 160 /tmp/result.json)"
          else
            echo "[refresher] $(date '+%F %T') 刷新失败，保留上一份数据"
          fi
          sleep "$${REFRESH_INTERVAL}"
        done
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ---------- 以下两个 service 属于 capture profile ----------
  #
  # 只有显式带 --profile capture 时才会创建，默认部署（docker compose up -d）
  # 仍然只有 app + refresher，端口与内存占用都是零。
  #
  # 拓扑（与 docs/deploy-capture.md 一致）：
  #
  #   novnc 容器 = Xvfb + x11vnc + noVNC，持有 :0 显示
  #        ▲ X11：宿主 127.0.0.1:6000（只发布到 loopback）
  #   chromium 容器 = 只跑浏览器（host 网络），CDP 127.0.0.1:9223
  #
  # 为什么 chromium 必须用 host 网络（踩过的坑，别改回去）：
  # 带界面的 Chrome 会**忽略 --remote-debugging-address**，强制只监听容器内的
  # 127.0.0.1（/proc/net/tcp 里是 0100007F:2407）。docker-proxy 做端口映射时是从
  # 容器 IP 连过去的，连不到容器 loopback —— 所以 "127.0.0.1:9222:9222" 这种映射
  # 永远打不通。改成 host 网络后，Chrome 监听的 127.0.0.1 就是宿主 loopback，
  # app 直接可达，同时仍然不暴露到局域网（也就完全不需要 ports 了）。
  #
  # 为什么不把 Xvfb/x11vnc 放进 chromium 容器：theasp/novnc 这个镜像本身的定位就是
  # “给其它容器提供浏览器可访问的 X 显示”（官方示例就是 IDE 容器连 novnc:0.0），
  # 它内部已经把 Xvfb、x11vnc、websockify 串好了；反过来让 novnc 去连一个外部
  # VNC 5900 反而要另改它的启动脚本。
  novnc:
    profiles: ["capture"]
    # 上游多年未更新、只发布 latest：用变量暴露，便于在 NAS 上换成固定 digest。
    image: ${CAPTURE_NOVNC_IMAGE:-theasp/novnc:latest}
    container_name: custom-hosts-novnc
    restart: unless-stopped
    # 只做画面转码转发，实测常驻 < 100MB，给 256MB 足够
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      DISPLAY_WIDTH: "1600"
      DISPLAY_HEIGHT: "968"
      # 不要示例里的 xterm，抓包场景只需要桌面 + 浏览器
      RUN_XTERM: "no"
      RUN_FLUXBOX: "yes"
      TZ: Asia/Shanghai
    ports:
      # noVNC 的静态页与 websockify 只发布到宿主 loopback：
      # 对外统一由 app 的 /novnc/* 提供（同源、带 Basic Auth、含 WS 升级转发）。
      # 直接发布到 0.0.0.0 会绕过登录，等于局域网里谁都能接管浏览器。
      - "127.0.0.1:${CAPTURE_NOVNC_PORT:-6080}:8080"
      # X11：只发布到宿主 loopback，给 host 网络的 chromium 用。
      # 写成 "6000:6000" 会把 X 显示暴露给局域网里任何人 —— 等于谁都能接管浏览器。
      - "127.0.0.1:${CAPTURE_X11_PORT:-6000}:6000"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  chromium:
    profiles: ["capture"]
    # 只跑浏览器的精简镜像：命令与 DISPLAY 都能直接覆盖，不像带桌面的镜像会
    # 自己起一套 X/窗口管理器，跟 novnc 容器的 :0 冲突。
    image: ${CAPTURE_CHROMIUM_IMAGE:-zenika/alpine-chrome:124}
    container_name: custom-hosts-chromium
    restart: unless-stopped
    # 与 app、refresher 一致：共享宿主网络栈，见上面的说明。
    # host 网络下不能写 ports / networks，compose 会直接报错。
    network_mode: host
    # Chromium 常驻 300–500MB，峰值（大页面 + 视频）可能到 800MB；
    # 给 1GB 上限 + 同额度 swap，超过就被 OOM 杀掉而不是拖垮 NAS。
    mem_limit: 1g
    memswap_limit: 1g
    # 配合 --disable-dev-shm-usage：/dev/shm 用不满，留 512MB 给渲染进程
    shm_size: "512mb"
    volumes:
      # 预览用的 hosts：把容器的 /etc/hosts 绑到宿主机文件，
      # app 容器挂的是同一个 data 目录，于是「写文件」就等于「改浏览器解析」。
      # 只影响这个容器，宿主机 /etc/hosts 完全不动。
      #
      # 注意：宿主上这个文件必须存在且是**文件**。若不存在，Docker 会建成目录，
      # /etc/hosts 就废了。deploy 脚本与应用启动都会兜底创建（见 preview-hosts.ts）。
      - ./data/preview-hosts:/etc/hosts
    depends_on:
      - novnc
    environment:
      # X 显示在 novnc 容器里，经宿主 loopback 的 6000 端口进来
      DISPLAY: "127.0.0.1:0"
      TZ: Asia/Shanghai
    # 镜像自带的 entrypoint 是 ["chromium-browser", "--headless"]，只写 command
    # 会变成在后面「追加」参数，--headless 永远在 —— 那样 /json/version 返回的是
    # HeadlessChrome，noVNC 里也不会有任何画面。必须清空 entrypoint 自己 exec。
    entrypoint: []
    command:
      - "/bin/sh"
      - "-c"
      - >-
        until nc -z -w1 127.0.0.1 ${CAPTURE_X11_PORT:-6000}; do sleep 1; done;
        exec /usr/lib/chromium/chromium
        --remote-debugging-port=${CAPTURE_CDP_PORT:-9223}
        --remote-allow-origins=*
        --no-sandbox
        --disable-dev-shm-usage
        --user-data-dir=/tmp/chrome
        --no-first-run
        --no-default-browser-check
        --disable-gpu
        --window-size=1600,968
        --start-maximized
        about:blank
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"


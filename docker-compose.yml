name: custom-hosts

services:
  app:
    build:
      context: .
      args:
        # 国内网络可改用 https://registry.npmmirror.com 加速 npm 安装
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: custom-hosts-optimizer:1.3.0
    container_name: custom-hosts
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    # 用 host 网络是为了拿到宿主机的 IPv6 出口：
    # bridge 网络默认没有 IPv6 路由，ULA + NAT66 又得手工维护 ip6tables，重启即失效。
    # 代价是不再做端口映射，服务直接监听宿主机端口（下面的 PORT）。
    network_mode: host
    environment:
      # 只绑 IPv4。宿主机有公网 IPv6 地址，绑到 :: 会把无鉴权控制台暴露到公网；
      # 出站 IPv6 探测不受监听地址影响，0.0.0.0 一样能连 IPv6 目标。
      HOST: 0.0.0.0
      PORT: "${APP_PORT:-8788}"
      # 探测 IPv6 候选（DoH 返回的 AAAA），优选结果里会同时输出 v4/v6 地址
      ENABLE_IPV6: "true"
      # 国际 DoH 在国内不可达，保持关闭
      ENABLE_INTL_DOH: "false"
      # 管理界面密码：控制台、/local/*、/api/* 需要 Basic Auth（用户名随意）；
      # /host、/host_fast、/host_block 不鉴权，方便直接订阅
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-123456}"
      # 设为 off 可整体关闭鉴权（不建议，控制台能直接改 hosts 配置）
      ADMIN_AUTH: "${ADMIN_AUTH:-on}"
      TZ: Asia/Shanghai
    volumes:
      # KV 快照、IP 缓存、阻断清单都在这里，容器重建不丢
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 每 2 小时触发一次全量刷新（与 IP 缓存 TTL 对齐）
  refresher:
    image: curlimages/curl:8.11.1
    container_name: custom-hosts-refresher
    restart: unless-stopped
    # 与 app 同网络命名空间，直接用 127.0.0.1 访问
    network_mode: host
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT:-8788}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-7200}
      TZ: Asia/Shanghai
      # 刷新接口现在需要认证，这里跟着主服务的密码走
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-123456}"
      ADMIN_AUTH: "${ADMIN_AUTH:-on}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[refresher] 已启动，间隔 $${REFRESH_INTERVAL}s"
        if [ "$${ADMIN_AUTH}" = "off" ]; then
          AUTH=""
        else
          AUTH="-u admin:$${ADMIN_PASSWORD}"
        fi
        while true; do
          if curl -fsS -m 600 $$AUTH -X POST "http://127.0.0.1:$${APP_PORT}/local/refresh?wait=true" -o /tmp/result.json; then
            echo "[refresher] $(date '+%F %T') 刷新成功 $(head -c 160 /tmp/result.json)"
          else
            echo "[refresher] $(date '+%F %T') 刷新失败，保留上一份数据"
          fi
          sleep "$${REFRESH_INTERVAL}"
        done
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

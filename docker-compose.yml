name: custom-hosts

services:
  app:
    build:
      context: .
      args:
        # 国内网络可改用 https://registry.npmmirror.com 加速 npm 安装
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: custom-hosts-optimizer:1.3.0
    container_name: custom-hosts
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    # 用 host 网络是为了拿到宿主机的 IPv6 出口：
    # bridge 网络默认没有 IPv6 路由，ULA + NAT66 又得手工维护 ip6tables，重启即失效。
    # 代价是不再做端口映射，服务直接监听宿主机端口（下面的 PORT）。
    network_mode: host
    environment:
      # 只绑 IPv4。宿主机有公网 IPv6 地址，绑到 :: 会把无鉴权控制台暴露到公网；
      # 出站 IPv6 探测不受监听地址影响，0.0.0.0 一样能连 IPv6 目标。
      HOST: 0.0.0.0
      PORT: "${APP_PORT:-8788}"
      # 探测 IPv6 候选（DoH 返回的 AAAA），优选结果里会同时输出 v4/v6 地址
      ENABLE_IPV6: "true"
      # 国际 DoH 在国内不可达，保持关闭
      ENABLE_INTL_DOH: "false"
      # 管理界面密码：控制台、/local/*、/api/* 需要 Basic Auth（用户名随意）；
      # /host、/host_fast、/host_block 不鉴权，方便直接订阅
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-123456}"
      # 设为 off 可整体关闭鉴权（不建议，控制台能直接改 hosts 配置）
      ADMIN_AUTH: "${ADMIN_AUTH:-on}"
      TZ: Asia/Shanghai
    volumes:
      # KV 快照、IP 缓存、阻断清单都在这里，容器重建不丢
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 每 2 小时触发一次全量刷新（与 IP 缓存 TTL 对齐）
  refresher:
    image: curlimages/curl:8.11.1
    container_name: custom-hosts-refresher
    restart: unless-stopped
    # 与 app 同网络命名空间，直接用 127.0.0.1 访问
    network_mode: host
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT:-8788}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-7200}
      TZ: Asia/Shanghai
      # 刷新接口现在需要认证，这里跟着主服务的密码走
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-123456}"
      ADMIN_AUTH: "${ADMIN_AUTH:-on}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[refresher] 已启动，间隔 $${REFRESH_INTERVAL}s"
        if [ "$${ADMIN_AUTH}" = "off" ]; then
          AUTH=""
        else
          AUTH="-u admin:$${ADMIN_PASSWORD}"
        fi
        while true; do
          if curl -fsS -m 600 $$AUTH -X POST "http://127.0.0.1:$${APP_PORT}/local/refresh?wait=true" -o /tmp/result.json; then
            echo "[refresher] $(date '+%F %T') 刷新成功 $(head -c 160 /tmp/result.json)"
          else
            echo "[refresher] $(date '+%F %T') 刷新失败，保留上一份数据"
          fi
          sleep "$${REFRESH_INTERVAL}"
        done
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ---------- 以下两个 service 属于 capture profile ----------
  #
  # 只有显式带 --profile capture 时才会创建，默认部署（docker compose up -d）
  # 仍然只有 app + refresher，端口与内存占用都是零。
  #
  # 拓扑（与 docs/deploy-capture.md 一致）：
  #
  #   novnc 容器 = Xvfb + x11vnc + noVNC，持有 :0 显示
  #        ▲ X11 (DISPLAY=novnc:0.0，走 capture 内网，不发布 6000 端口)
  #   chromium 容器 = 只跑浏览器，CDP :9222 只绑宿主 loopback
  #
  # 为什么不把 Xvfb/x11vnc 放进 chromium 容器：theasp/novnc 这个镜像本身的定位就是
  # “给其它容器提供浏览器可访问的 X 显示”（官方示例就是 IDE 容器连 novnc:0.0），
  # 它内部已经把 Xvfb、x11vnc、websockify 串好了；反过来让 novnc 去连一个外部
  # VNC 5900 反而要另改它的启动脚本。
  novnc:
    profiles: ["capture"]
    # 上游多年未更新、只发布 latest：用变量暴露，便于在 NAS 上换成固定 digest。
    image: ${CAPTURE_NOVNC_IMAGE:-theasp/novnc:latest}
    container_name: custom-hosts-novnc
    restart: unless-stopped
    # 只做画面转码转发，实测常驻 < 100MB，给 256MB 足够
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      DISPLAY_WIDTH: "1600"
      DISPLAY_HEIGHT: "968"
      # 不要示例里的 xterm，抓包场景只需要桌面 + 浏览器
      RUN_XTERM: "no"
      RUN_FLUXBOX: "yes"
      TZ: Asia/Shanghai
    ports:
      # 对外只暴露 noVNC 网页。该镜像自带 HTTP Basic Auth 之外的任何鉴权都没有，
      # 局域网以外访问必须由前面一层反向代理加认证（见 docs/deploy-capture.md）。
      - "${CAPTURE_NOVNC_PORT:-6080}:8080"
    networks:
      - capture
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  chromium:
    profiles: ["capture"]
    # 只跑浏览器的精简镜像：命令与 DISPLAY 都能直接覆盖，不像带桌面的镜像会
    # 自己起一套 X/窗口管理器，跟 novnc 容器的 :0 冲突。
    image: ${CAPTURE_CHROMIUM_IMAGE:-zenika/alpine-chrome:124}
    container_name: custom-hosts-chromium
    restart: unless-stopped
    # Chromium 常驻 300–500MB，峰值（大页面 + 视频）可能到 800MB；
    # 给 1GB 上限 + 同额度 swap，超过就被 OOM 杀掉而不是拖垮 NAS。
    mem_limit: 1g
    memswap_limit: 1g
    # 配合 --disable-dev-shm-usage：/dev/shm 用不满，留 512MB 给渲染进程
    shm_size: "512mb"
    depends_on:
      - novnc
    environment:
      # X 显示在 novnc 容器里，走 compose 内网的 6000 端口（X11 TCP）
      DISPLAY: "novnc:0.0"
      TZ: Asia/Shanghai
    ports:
      # 关键：只绑宿主机 loopback。
      # app 容器用 host 网络，直接访问 http://127.0.0.1:9222 即可；
      # 局域网、公网、其它机器都连不到 CDP —— 拿到 CDP 等于拿到浏览器全部能力，
      # 绝不能写成 "9222:9222" 或 "0.0.0.0:9222:9222"。
      - "127.0.0.1:${CAPTURE_CDP_PORT:-9222}:9222"
    networks:
      - capture
    command:
      - "--remote-debugging-port=9222"
      # 不写这行 Chromium 只监听容器内 127.0.0.1，宿主机的端口映射会连不上；
      # 真正的隔离靠上面 ports 的 127.0.0.1 前缀，而不是靠这里。
      - "--remote-debugging-address=0.0.0.0"
      # 抓包后端从 Node 侧建立 WebSocket，Origin 不是 devtools://，必须放开
      - "--remote-allow-origins=*"
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--user-data-dir=/tmp/chrome"
      - "--no-first-run"
      - "--no-default-browser-check"
      # Xvfb 没有 GPU，关掉硬件加速省内存也避免渲染异常
      - "--disable-gpu"
      - "--window-size=1600,968"
      - "--start-maximized"
      - "about:blank"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

networks:
  # 抓包专用内网：只承载 X11 与 CDP，不接 app（app 用 host 网络）
  capture:
    name: custom-hosts-capture
    driver: bridge
